<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join a VERSUS race · Garage Rush</title>
<meta name="description" content="A friend invited you to a VERSUS race in Garage Rush. Tap to join their lobby.">
<meta property="og:title" content="Race me in Garage Rush!">
<meta property="og:description" content="Tap to join my VERSUS lobby.">
<meta property="og:image" content="https://tippsstudios.github.io/img/icon_192.png">
<link rel="icon" href="img/icon_192.png">
<link rel="stylesheet" href="style.css">
<style>
  .join { max-width: 560px; margin: 48px auto; padding: 0 16px; text-align: center; }
  .join img.icon { width: 96px; height: 96px; border-radius: 22px; }
  .join .code { display: inline-block; margin: 14px 0 22px; padding: 10px 22px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-size: 34px; font-weight: bold; letter-spacing: 6px; color: var(--gold); }
  .join .button { font-size: 20px; padding: 14px 26px; }
  .join .small { font-size: 14px; margin-top: 22px; }
</style>
</head>
<body>
<nav>
  <div class="in">
    <a class="brand" href="index.html"><img src="img/icon_192.png" alt="Garage Rush"><span>Garage Rush</span></a>
    <a href="index.html">Home</a>
    <a href="guide.html#versus">How to play</a>
  </div>
</nav>

<main class="join">
  <img class="icon" src="img/icon_192.png" alt="">
  <h1>Join my VERSUS race</h1>
  <p>Your friend's lobby code:</p>
  <div class="code" id="code">------</div>
  <p><a class="button" id="open" href="#">Open Garage Rush</a></p>
  <p class="small">Nothing happened? Open Garage Rush, tap <b>RACE</b>, then <b>VERSUS</b>, then <b>JOIN</b>, and type the code.<br>
    Don't have the game yet? <a href="https://play.google.com/store/apps/details?id=com.paulbica.garagerush">Get it on Google Play</a>.</p>
</main>

<script>
  // The game's join link (VersusWindow's SHARE): garagerush://join?code=ABC123 opens Garage Rush on Android and
  // joins that lobby (the game also opens this page's link itself, an App Link: .well-known/assetlinks.json); a browser
  // that can't open it comes back here with &stay=1, and the page shows the steps and the Play Store link
  var code = (new URLSearchParams(location.search).get('code') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
  var store = 'https://play.google.com/store/apps/details?id=com.paulbica.garagerush';
  var link = /android/i.test(navigator.userAgent)
    ? 'intent://join?code=' + code + '#Intent;scheme=garagerush;package=com.paulbica.garagerush;S.browser_fallback_url=' + encodeURIComponent(location.origin + location.pathname + '?code=' + code + '&stay=1') + ';end'
    : 'garagerush://join?code=' + code;
  var stay = new URLSearchParams(location.search).has('stay');  // the browser couldn't open the game: show the steps
  if (code) {
    document.getElementById('code').textContent = code;
    document.getElementById('open').href = link;
    if (!stay)
      location.href = link;  // straight into the game; the button is there if the browser waits for a tap
  } else {
    document.getElementById('open').href = store;
  }
</script>
</body>
</html>
