<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tipps Studios</title>
<meta name="description" content="Tipps Studios makes Garage Rush, a cartoon stunt racing game for Android.">
<link rel="icon" href="icon.png">
<style>
  :root { --bg: #17191f; --panel: #22252d; --text: #f2f0ea; --muted: #b9b4a8; --accent: #f29a2e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: Arial, Helvetica, sans-serif; line-height: 1.5; }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px; }
  .game { display: flex; gap: 24px; align-items: center; background: var(--panel); border-radius: 16px; padding: 24px; }
  .game img { width: 112px; height: 112px; border-radius: 24px; flex: none; }
  h1 { margin: 0 0 32px; font-size: 28px; letter-spacing: 0.5px; }
  h2 { margin: 0 0 8px; font-size: 24px; color: var(--accent); }
  p { margin: 0 0 8px; color: var(--muted); }
  a { color: var(--accent); }
  footer { margin-top: 32px; color: var(--muted); font-size: 14px; }
  @media (max-width: 520px) { .game { flex-direction: column; text-align: center; } }
</style>
</head>
<body>
<main>
  <h1>Tipps Studios</h1>
  <section class="game">
    <img src="icon.png" alt="Garage Rush icon">
    <div>
      <h2>Garage Rush</h2>
      <p>A cartoon stunt racer: jump, flip and race 50 stages in five worlds before the clock runs out. Upgrade your car, unlock new ones and beat the leaderboards.</p>
      <p>Coming soon to <a href="https://play.google.com/store/apps/details?id=com.paulbica.garagerush">Google Play</a>.</p>
    </div>
  </section>
  <footer>
    <p><a href="https://sites.google.com/view/garagerush-privacy">Privacy policy</a> · Contact: <a href="mailto:tippsstudios@gmail.com">tippsstudios@gmail.com</a></p>
  </footer>
</main>
</body>
</html>
